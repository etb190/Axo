name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build installer (electron-forge make)
        run: npx electron-forge make

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Axo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            Windows installer for Axo.

            ## Install
            1. Download **axo-*.exe** below (e.g. `axo-1.0.0 Setup.exe`).
            2. Run it — Axo installs and launches automatically.

            Built with Electron Forge (Squirrel.Windows).
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          fail_on_unmatched_files: true
          generate_release_notes: true
